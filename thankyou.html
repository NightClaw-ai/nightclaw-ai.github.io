<head>

<title>ご購入ありがとうございます｜NightClaw-ai</title>
<style>
:root {
  --primary: #7c3aed;
  --primary-light: #a78bfa;
  --bg-dark: #050505;
  --bg-card: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.08);
  --text-main: #f3f4f6;
  --text-sub: #9ca3af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; 
  color: var(--text-main); 
  background: var(--bg-dark); 
  line-height: 1.6;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 600px;
  width: 100%;
  padding: 60px 30px;
  background: radial-gradient(circle at 50% 50%, #1a0a2e 0%, #050505 100%);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.icon {
  width: 80px;
  height: 80px;
  background: var(--primary);
  border-radius: 50%;
  margin: 0 auto 32px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
}
.icon svg { width: 40px; height: 40px; fill: white; }
h1 { font-size: 2rem; margin-bottom: 16px; font-weight: 800; }
p { color: var(--text-sub); margin-bottom: 40px; font-size: 1.1rem; }
.download-btn {
  display: inline-block;
  padding: 18px 44px;
  background: var(--primary);
  color: white;
  text-decoration: none;
  font-weight: 700;
  font-size: 1.15rem;
  border-radius: 12px;
  transition: all 0.3s ease;
  box-shadow: 0 10px 30px rgba(124, 58, 237, 0.3);
  margin-bottom: 24px;
}
.download-btn:hover {
  transform: translateY(-3px);
  background: #8b5cf6;
}
.note { font-size: 0.9rem; color: #555; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
  </div>

</div>
